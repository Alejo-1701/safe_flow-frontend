<div class="stat-card">
  <div class="header">
    <span class="title">{{ title }}</span>
    <i *ngIf="icon" [class]="icon"></i>
  </div>
  <div class="body">
    <div class="value">{{ value }}</div>
    <div *ngIf="trend" class="trend" [class]="trendType">
      {{ trend }}
    </div>
  </div>
</div>
