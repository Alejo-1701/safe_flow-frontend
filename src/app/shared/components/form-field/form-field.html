<div class="form-field-container">

  <!-- Cabecera de la sección (Icono y Título opcional) -->
  <div class="form-field-header" *ngIf="title">
    <span class="header-icon" *ngIf="iconClass">
      <i [class]="iconClass"></i>
    </span>
    <h2>{{ title }}</h2>
  </div>

  <!-- Formulario reactivo enlazado al FormGroup auto-generado -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-field-grid">

      <!-- Iteración de cada campo según la configuración FieldConfig -->
      <div class="form-field-group" *ngFor="let field of fields">
        <label [for]="field.key">{{ field.label }}</label>

        <!-- Inputs estándar (text, email, tel, password, date) con mayúsculas automáticas -->
        <input
          *ngIf="field.type !== 'select'"
          [id]="field.key"
          [type]="field.type"
          [formControlName]="field.key"
          [placeholder]="field.placeholder || ''"
          (input)="onInputUppercase($event, field.key)"
          class="form-field-control uppercase-input"
        />

        <!-- Selects dinámicos basados en opciones -->
        <select
          *ngIf="field.type === 'select'"
          [id]="field.key"
          [formControlName]="field.key"
          class="form-field-control"
        >
          <option value="" disabled selected>Seleccione una opción</option>
          <option *ngFor="let option of field.options" [value]="option.value">
            {{ option.label }}
          </option>
        </select>

        <!-- Mensaje de error visual si el campo requerido está vacío y fue tocado -->
        <div *ngIf="form.get(field.key)?.invalid && form.get(field.key)?.touched" class="error-message">
          Este campo es obligatorio.
        </div>
      </div>
    </div>

    <!-- Botonera de acciones inferior (Cancelar / Guardar) -->
    <div class="form-field-actions" *ngIf="submitLabel || cancelLabel">
      <button type="button" class="btn-cancel" *ngIf="cancelLabel" (click)="onCancel()">
        {{ cancelLabel }}
      </button>
      <button type="submit" class="btn-submit" *ngIf="submitLabel">
        {{ submitLabel }}
      </button>
    </div>
  </form>
</div>
