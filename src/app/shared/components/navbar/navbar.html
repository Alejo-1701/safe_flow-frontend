<nav class="navbar">
  <div class="left-section">
    <div class="brand">
      <img src="assets/images/logo.png" alt="SafeFlow Logo" class="brand-logo">
      <span class="brand-name">SafeFlow</span>
    </div>
    <input *ngIf="showSearch" type="text" placeholder="Buscar..." class="search-input">
  </div>

  <!--
    Código de verificación de visitantes. Solo se muestra cuando la vista lo
    habilita con [showVerificationCode] (portal del residente); portería la
    deja apagado. Rota únicamente al agotarse su ventana de tiempo.
  -->
  <app-verification-code *ngIf="showVerificationCode"></app-verification-code>

  <!-- Botón que activa el menú en móvil -->
  <button class="hamburger" (click)="toggleMenu()" aria-label="Toggle navigation">
    <span class="hamburger-bar"></span>
    <span class="hamburger-bar"></span>
    <span class="hamburger-bar"></span>
  </button>

  <!-- La clase .active se agrega cuando isMenuOpen es true -->
  <div class="right-section" [class.active]="isMenuOpen">
    <button *ngIf="showProfileButton" (click)="onProfile()">Actualizar Datos</button>
    <button (click)="onLogout()">Cerrar Sesión</button>

    <div class="user-profile" (click)="onProfile()">
      <img *ngIf="avatarUrl" [src]="avatarUrl" [alt]="userName" class="avatar">
      <div class="user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">{{ userRole }}</span>
      </div>
    </div>
  </div>

  @if (showLogoutConfirm) {
    <div class="logout-confirm-overlay" (click)="cancelLogout()">
      <div class="logout-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="logout-confirm-title" (click)="$event.stopPropagation()">
        <h2 id="logout-confirm-title">Cerrar sesión</h2>
        <p>¿Seguro que deseas cerrar sesión?</p>
        <div class="logout-confirm-actions">
          <button type="button" class="btn-cancel" (click)="cancelLogout()">Cancelar</button>
          <button type="button" class="btn-confirm" (click)="confirmLogout()">Cerrar sesión</button>
        </div>
      </div>
    </div>
  }
</nav>
