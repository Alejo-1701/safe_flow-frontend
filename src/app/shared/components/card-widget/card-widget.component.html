<div class="card-widget-container">
  <!-- Encabezado: Fondo oscuro solo si hay título o icono -->
  <div class="card-widget-header" [class.has-header]="title || icon">
    <div class="header-left" *ngIf="title || icon">
      <i *ngIf="icon" [class]="icon + ' header-icon-top'"></i>
      <h3 class="card-title">{{ title }}</h3>
    </div>
    <ng-content select="[header-badge]"></ng-content>
  </div>
  
  <div class="card-widget-body">
    <ng-content></ng-content>
  </div>

  <div class="card-footer" *ngIf="actionLabel">
    <button 
      class="card-widget-action" 
      [class.card-widget-action--outline]="actionStyle === 'outline'"
      (click)="onActionClick()">
      {{ actionLabel }}
    </button>
  </div>
</div>
