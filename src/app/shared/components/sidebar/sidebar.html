<aside>
  <div class="sidebar-header">
    <div class="brand-logo">
      <span class="material-symbols-outlined logo-icon" aria-hidden="true">shield</span>
    </div>
    <h1>{{ title }}</h1>
  </div>

  <nav>
    @for (item of navItems; track item.route) {
      <a [routerLink]="getFullRoute(item.route)"
         routerLinkActive="nav-item-active"
         [routerLinkActiveOptions]="{ exact: false }"
         class="nav-item group">

        <span class="material-symbols-outlined nav-icon" aria-hidden="true">{{ item.icon }}</span>

        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-profile">
      <div class="profile-avatar">
        <span class="material-symbols-outlined footer-icon" aria-hidden="true">person</span>
      </div>
      <div class="profile-info" *ngIf="currentUser.name || currentUser.role">
        <p class="profile-name">{{ currentUser.name }}</p>
        <p class="profile-role">{{ currentUser.role }}</p>
      </div>
    </div>

    <button *ngIf="showOptionsButton" type="button" (click)="onOptions()" title="Opciones">
      <span class="material-symbols-outlined footer-icon" aria-hidden="true">more_vert</span>
    </button>

    <button type="button" (click)="logout()" title="Cerrar sesión">
      <span class="material-symbols-outlined logout-icon" aria-hidden="true">logout</span>
    </button>
  </div>
</aside>
