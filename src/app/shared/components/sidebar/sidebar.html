<!-- Barra superior fija con botón hamburguesa para pantallas móviles / tablets -->
<div class="mobile-topbar">
  <div class="mobile-brand">
    <div class="brand-logo">
      <img src="assets/images/logo.png" alt="Safe Flow Logo" class="logo-img" />
    </div>
    <h1>Safe Flow</h1>
  </div>

  <button
    type="button"
    class="btn-hamburger"
    (click)="toggleMobileMenu()"
    [attr.aria-label]="isMobileMenuOpen ? 'Cerrar menú' : 'Abrir menú'">
    <span class="material-symbols-outlined">
      {{ isMobileMenuOpen ? 'close' : 'menu' }}
    </span>
  </button>
</div>

<!-- Fondo oscuro semitransparente al desplegar el menú móvil -->
<div
  class="sidebar-backdrop"
  *ngIf="isMobileMenuOpen"
  (click)="closeMobileMenu()">
</div>

<!-- Sidebar principal -->
<aside [class.mobile-open]="isMobileMenuOpen">
  <div class="sidebar-header">
    <div class="brand-logo">
      <span class="material-symbols-outlined logo-icon" aria-hidden="true">shield</span>
    </div>
    <h1>Safe Flow</h1>

    <button type="button" class="btn-close-mobile" (click)="closeMobileMenu()" aria-label="Cerrar menú">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <nav>
    @for (item of navItems; track item.route) {
      <a [routerLink]="getFullRoute(item.route)"
         routerLinkActive="nav-item-active"
         [routerLinkActiveOptions]="{ exact: false }"
         class="nav-item group"
         (click)="closeMobileMenu()">

        <span class="material-symbols-outlined nav-icon" aria-hidden="true">{{ item.icon }}</span>

        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-profile">
      <div class="profile-avatar">
        <span class="material-symbols-outlined footer-icon" aria-hidden="true">person</span>
      </div>
      <div class="profile-info">
        <p class="profile-name">{{ currentUser.name }}</p>
        <p class="profile-role">{{ currentUser.role }}</p>
      </div>
    </div>

    <button (click)="logout()" type="button" title="Cerrar sesión">
      <span class="material-symbols-outlined logout-icon" aria-hidden="true">logout</span>
    </button>
  </div>
</aside>
