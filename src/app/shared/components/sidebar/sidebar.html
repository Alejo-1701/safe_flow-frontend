<!-- Barra superior fija para móviles -->
<div class="mobile-topbar">
  <div class="mobile-brand">
    <div class="brand-logo">
      <img src="assets/images/logo.png" alt="Safe Flow Logo" class="logo-img" />
    </div>
    <h1>Safe Flow</h1>
  </div>

  <button
    type="button"
    class="btn-hamburger"
    (click)="toggleMobileMenu()"
    [attr.aria-label]="isMobileMenuOpen ? 'Cerrar menú' : 'Abrir menú'">
    <span class="material-symbols-outlined">
      {{ isMobileMenuOpen ? 'close' : 'menu' }}
    </span>
  </button>
</div>

<!-- Fondo oscuro semitransparente al abrir menú móvil -->
<div
  class="sidebar-backdrop"
  *ngIf="isMobileMenuOpen"
  (click)="closeMobileMenu()">
</div>

<!-- Panel Sidebar principal -->
<aside [class.mobile-open]="isMobileMenuOpen">
  <div class="sidebar-header">
    <div class="brand-logo">
      <img src="assets/images/logo.png" alt="Safe Flow Logo" class="logo-img" />
    </div>
    <h1>Safe Flow</h1>

    <button type="button" class="btn-close-mobile" (click)="closeMobileMenu()" aria-label="Cerrar menú">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <nav>
    @for (item of displayNavItems; track item.route) {
      <a [routerLink]="getFullRoute(item.route)"
         class="nav-item group"
         [class.nav-item-active]="isActive(item)"
         [attr.aria-current]="isActive(item) ? 'page' : null"
         (click)="closeMobileMenu()">

        <span class="material-symbols-outlined nav-icon" aria-hidden="true">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">

    <!-- Botón de actualización de datos condicional (solo aparece en tu pantalla de guardia) -->
    <div *ngIf="showUpdateData" class="update-data-container" style="margin-bottom: 12px; padding: 0 8px;">
      <button
        type="button"
        class="btn-update-data"
        (click)="triggerUpdateData()"
        style="width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px; background-color: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer;">
        <span class="material-symbols-outlined" aria-hidden="true">sync</span>
        <span>Actualizar Datos</span>
      </button>
    </div>

    <div class="sidebar-profile">
      <div class="profile-avatar">
        <span class="material-symbols-outlined footer-icon" aria-hidden="true">person</span>
      </div>
      <div class="profile-info">
        <p class="profile-name">{{ currentUser.name }}</p>
        <p class="profile-role">{{ currentUser.role }}</p>
      </div>
    </div>

    <button (click)="logout()" type="button" title="Cerrar sesión">
      <span class="material-symbols-outlined logout-icon" aria-hidden="true">logout</span>
    </button>
  </div>
</aside>
