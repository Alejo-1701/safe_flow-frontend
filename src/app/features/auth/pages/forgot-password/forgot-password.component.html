<div class="forgot-password-container">
  <div class="logo-container">
    <img src="assets/images/logo.png" alt="Logo" class="logo-icon"> <!-- Ajusta la ruta si es necesario -->
    <span class="logo-text">SafeFlow</span>
  </div>

  <app-card-widget title="Recuperar Contraseña"
    subtitle="Ingresa tu correo electrónico registrado para enviarte las instrucciones de recuperación.">

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email" placeholder="ejemplo@correo.com">
      </div>

      <button type="submit" class="submit-btn" [disabled]="forgotPasswordForm.invalid">
        Enviar Instrucciones
      </button>
    </form>

    <div class="footer-link">
      <a routerLink="/auth">← Volver al Inicio de Sesión</a>
    </div>
  </app-card-widget>
</div>
