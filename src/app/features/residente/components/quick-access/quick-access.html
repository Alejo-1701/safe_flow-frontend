<app-card-widget title="Accesos Rápidos" icon="bolt">
  <div class="quick-grid">
    <button type="button" class="quick-tile" (click)="onOpen('documentos')">
      <span class="material-symbols-outlined quick-icon" aria-hidden="true">folder</span>
      <span class="quick-label">Documentos</span>
    </button>

    <button type="button" class="quick-tile" (click)="onOpen('reglamento')">
      <span class="material-symbols-outlined quick-icon" aria-hidden="true">menu_book</span>
      <span class="quick-label">Reglamento</span>
    </button>

    <button type="button" class="quick-tile" (click)="onOpen('mapa')">
      <span class="material-symbols-outlined quick-icon" aria-hidden="true">map</span>
      <span class="quick-label">Mapa</span>
    </button>
  </div>
</app-card-widget>
