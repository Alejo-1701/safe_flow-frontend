<div class="registro-layout">

  <!--
    Menú lateral (componente compartido `app-sidebar`).
    Aporta el logo, los enlaces, el pie con el usuario y el botón de
    "Cerrar Sesión", que ya vive dentro del propio componente.
  -->
  <app-sidebar
    basePath="/residente"
    [customNavItems]="navItems"
    [currentUser]="currentUser">
  </app-sidebar>

  <main class="registro-content">

    <div class="registro-inner">

      <!-- Encabezado de la vista -->
      <header class="page-header">
        <h1>Registrar Nuevo Vehículo</h1>
        <p>Completa los datos del vehículo para registrarlo en tu cuenta.</p>
      </header>

      <!--
        Formulario (componente compartido `form-field`).
        Genera el grid de campos, las validaciones y la botonera
        "Cancelar" / "REGISTRAR VEHÍCULO".

        `[style.--swatch-color]` publica el color escrito para que el
        indicador del campo "Color" lo muestre (ver registro-vehiculo.scss).
        El `(input)` recoge ese valor sin tocar el componente compartido.
      -->
      <form-field
        class="vehicle-card"
        title="Información del Vehículo"
        iconClass="directions_car"
        [fields]="vehicleFields"
        cancelLabel="Cancelar"
        submitLabel="REGISTRAR VEHÍCULO"
        [style.--swatch-color]="colorPreview()"
        (input)="onFormInput($event)"
        (formSubmitted)="onRegisterVehicle($event)"
        (formCancelled)="onCancel()">
      </form-field>

    </div>
  </main>
</div>
