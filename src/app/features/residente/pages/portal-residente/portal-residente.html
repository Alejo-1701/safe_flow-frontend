<div class="portal">
  <!-- Barra superior: logo, acciones y perfil del residente -->
  <!-- Los valores de respaldo ("Usuario"/"Residente") se muestran mientras el
       backend entrega el nombre/rol real del residente. -->
  <app-navbar
    [userName]="resident.name || 'Usuario'"
    [userRole]="resident.role || 'Residente'"
    (profileClick)="onProfile()"
    (logoutClick)="onLogout()">
  </app-navbar>

  <main class="portal-content">
    <!-- Notificación superior: visitante en portería -->
    <app-visitor-alert></app-visitor-alert>

    <div class="portal-grid">
      <!-- Columna principal -->
      <div class="portal-col portal-col--main">
        <app-parking-status></app-parking-status>
        <app-preauthorize-guest></app-preauthorize-guest>
      </div>

      <!-- Columna lateral -->
      <div class="portal-col portal-col--side">
        <app-my-vehicles (register)="onRegisterVehicle()"></app-my-vehicles>
        <app-my-requests (newRequest)="abrirSolicitud()"></app-my-requests>
        <app-quick-access></app-quick-access>
      </div>
    </div>

    <!-- Historial de visitas: a lo ancho, debajo de las dos columnas -->
    <app-recent-visits></app-recent-visits>
  </main>

  <!--
    Modal "Nueva Solicitud de Residente". Se controla con [open]; al enviar o
    cancelar emite y el portal decide el cierre.
  -->
  <app-nueva-solicitud
    [open]="solicitudAbierta"
    (cerrado)="cerrarSolicitud()"
    (enviada)="enviarSolicitud($event)">
  </app-nueva-solicitud>

  <!--
    Modales de las pantallas que antes tenían ruta propia. Se abren desde el
    portal (botón "Actualizar Datos"/chip de usuario y "+ Registrar") y
    conservan todo el contenido de las antiguas vistas.
  -->
  <app-modal-perfil
    [open]="perfilAbierto()"
    (cerrado)="cerrarPerfil()">
  </app-modal-perfil>

  <app-modal-registro-vehiculo
    [open]="vehiculoAbierto()"
    (cerrado)="cerrarRegistroVehiculo()">
  </app-modal-registro-vehiculo>
</div>
