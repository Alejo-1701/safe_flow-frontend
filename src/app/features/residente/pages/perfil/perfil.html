<div class="perfil-layout">

  <!-- Menú lateral (componente compartido app-sidebar) -->
  <app-sidebar
    basePath="/residente"
    [customNavItems]="navItems"
    [currentUser]="currentUser">
  </app-sidebar>

  <main class="perfil-content">

    <!-- Bloque centrado (horizontal y verticalmente) dentro del contenido -->
    <div class="perfil-inner">

      <!-- Encabezado de la vista -->
      <header class="page-header">
        <h1>Editar Información Personal</h1>
        <p>Actualiza tus datos de contacto y seguridad de tu cuenta.</p>
      </header>

      <section class="perfil-cards">

        <!-- Card 1: Datos del Residente (sin botonera) -->
        <form-field
          class="resident-card"
          title="Datos del Residente"
          iconClass="badge"
          [fields]="residentFields"
          submitLabel=""
          cancelLabel=""
          (formSubmitted)="onSaveResident($event)">
        </form-field>

        <!-- Card 2: Cambiar Contraseña -->
        <form-field
          class="password-card"
          title="Cambiar Contraseña"
          iconClass="lock"
          [fields]="passwordFields"
          cancelLabel="Cancelar"
          submitLabel="Guardar Cambios"
          (formSubmitted)="onSavePassword($event)"
          (formCancelled)="onCancel()">
        </form-field>

        <!-- Banner informativo (reutiliza app-card-widget) -->
        <app-card-widget
          class="security-note"
          icon="info"
          title="Información de Seguridad"
          [subtitle]="securityMessage">
        </app-card-widget>

      </section>

    </div>
  </main>
</div>
